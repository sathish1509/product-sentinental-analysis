version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: product_reviews_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: product_reviews

  backend:
    build: ./backend
    container_name: review_sentiment_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/product_reviews
      - PYTHON_PATH=python
      - MODEL_DIR=../data/models
      - DATA_DIR=../data/raw
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: review_sentiment_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
